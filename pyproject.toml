[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "computer-use-vertical-slice"
version = "0.1.0"
description = "Computer-Use Automation Take-Home - Complete Vertical Slice"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "playwright>=1.42.0",
    "pydantic>=2.6.0",
    "openai>=1.14.0",
    "pytest>=8.0.0",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.9",
    "requests>=2.31.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.pylint.messages_control]
disable = [
    "C0103",
    "C0114",
    "C0115",
    "C0116",
    "C0301",
    "C0303",
    "C0304",
    "C0325",
    "C0411",
    "C0413",
    "C0415",
    "E0401",
    "E1101",
    "R0801",
    "R0903",
    "R0911",
    "R0912",
    "R0913",
    "R0914",
    "R0915",
    "R0916",
    "R0917",
    "R1702",
    "R1705",
    "R1732",
    "W0107",
    "W0611",
    "W0612",
    "W0613",
    "W0622",
    "W0718",
    "W1309",
    "W1510",
    "W1514"
]


[tool.pylint.format]
max-line-length = 120

