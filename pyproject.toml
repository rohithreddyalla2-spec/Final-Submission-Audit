[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "computer-use-vertical-slice"
version = "0.1.0"
description = "Computer-Use Automation Take-Home - Complete Vertical Slice"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "playwright>=1.42.0",
    "pydantic>=2.6.0",
    "openai>=1.14.0",
    "pytest>=8.0.0",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.9",
    "requests>=2.31.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

